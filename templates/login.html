<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cukai.ai — Sign in</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <span class="brand-name center-block"><span class="nm-dark">cukai</span><span class="nm-light">.ai</span></span>
      <p class="muted center">Sign in to continue</p>

      <!-- The login form. When you click "Sign in", it sends the username and
           password to the /userLogin route in main.py. -->
      <form action="/userLogin" method="post">
        <label>Username</label>
        <input type="text" name="username" placeholder="soleprop or partner" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>

        <!-- This red message only appears if the login failed. -->
        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}

        <button type="submit" class="btn">Sign in</button>
      </form>

      <p class="muted center small">Demo logins — soleprop or partner · password: cukai123</p>
    </div>
  </div>
</body>
</html>
